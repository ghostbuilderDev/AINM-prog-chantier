    try{const text=localStorage.getItem(KEY);if(text){state=C.validateBackup({app:'ainm-programmation',schemaVersion:1,state:JSON.parse(text)});return;}}
    catch(err){storageOK=false;window.setTimeout(()=>warnStorage('Données locales indisponibles ou illisibles. Ne fermez pas cette page sans exporter une sauvegarde. '+err.message),100);}
    state=fresh();
  }
  function warnStorage(msg){const el=$('#storage-warning');if(el){el.textContent=msg;el.classList.add('show');}storageOK=false;}
  function persist(action='',target=''){
    if(foreignChange){warnStorage('Les données ont changé dans un autre onglet. Sauvegardez votre version en JSON puis rechargez cette page avant de continuer.');return false;}
    state.revision=(state.revision||0)+1;
    if(action){state.audit=state.audit||[];state.audit.unshift({at:C.now(),action,target});state.audit=state.audit.slice(0,300);}
    try{
      const value=JSON.stringify(state),previous=localStorage.getItem(KEY);if(previous)localStorage.setItem(KEY+'.previous',previous);localStorage.setItem(KEY,value);storageOK=true;
      if($('#save-state'))$('#save-state').textContent='Enregistré sur cet appareil';return true;
    }catch(err){warnStorage('Enregistrement local impossible (stockage bloqué ou saturé). Vos changements restent dans la page ouverte : utilisez « Sauvegarder JSON » immédiatement.');return false;}
  }
  function markWeek(w=current()){w.modifiedAt=C.now();}
  function shell(){
    $('#app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="brandmark">AINM</div><div><strong>AINM Travaux</strong><small>Préparer · vérifier · transmettre</small></div></div><div class="navlabel">ESPACE TRAVAUX</div><nav aria-label="Navigation principale">${[['planning','▦','Programmation'],['projects','▤','Fiches chantiers'],['history','◷','Historique'],['checks','✓','Contrôles'],['data','⇄','Données & aide']].map(([v,i,l])=>`<button class="navbutton" data-action="nav" data-view="${v}"><span class="navicon">${i}</span>${l}</button>`).join('')}</nav><div class="sidefoot"><strong>Petit / Dahmani</strong>Référentiel de vos chantiers.<br>Prévisions de travaux uniquement.<br><br>Version 1.0 · stockage local<br>Sans connexion à un serveur métier.</div></aside><div class="workspace"><header class="topbar"><div class="path">UOTx / <strong>Programmation AINM</strong></div><div class="actions"><span class="statusline"><i class="dot"></i><span id="save-state">Stockage local</span></span>${b('backup','Sauvegarder JSON','small')}</div></header><div id="storage-warning" class="storage-warning" role="alert"></div><main class="main" id="main"></main></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>`;
    if(location.protocol==='file:')warnStorage('Mode fichier local : utilisez régulièrement « Sauvegarder JSON ». Les données sont propres à ce navigateur et à cet emplacement du fichier. Aucune synchronisation entre appareils.');
    $('#save-state').textContent=storageOK?'Enregistré sur cet appareil':'Sauvegarde JSON recommandée';
  }
  function render(){
    $$('.navbutton').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
    $('#main').innerHTML=({planning:planningPage,projects:projectsPage,history:historyPage,checks:checksPage,data:dataPage})[view]();
    document.title='AINM · '+C.weekLabel(current());
  }
  function heading(kicker,title,subtitle,actions=''){return `<div class="pagehead"><div><div class="kicker">${kicker}</div><h1>${title}</h1><p class="muted">${subtitle}</p></div><div class="actions">${actions}</div></div>`;}
  function weekbar(){const w=current();return `<div class="weekbar"><div class="weekinfo"><div class="weekbadge"><small>${w.period==='we'?'WEEK-END':'SEMAINE'}</small><strong>${w.week}</strong></div><div><label for="week-select">Programmation sélectionnée</label><select id="week-select">${sortedWeeks().map(v=>`<option value="${e(v.id)}" ${v.id===w.id?'selected':''}>${e(C.weekLabel(v))}${v.id.startsWith('source-')?'':' · préparation'}</option>`).join('')}</select><p>${e(C.rangeLabel(w))} · ${w.operations.filter(o=>o.active).length} opération(s) travaillée(s)</p></div></div><div class="actions">${b('new-week','+ Nouvelle semaine','small')}${b('copy-week','Reprendre une semaine','small')}${b('edit-week','Paramètres','small')}</div></div>`;}
  function planningPage(){
    const w=current(),s=C.weekStats(w);
    return heading('Planifier les travaux','Votre programmation, prête à compléter.','Choisissez les chantiers travaillés, ajustez leurs configurations et retrouvez la trame Excel.',b('preview','Aperçu Excel')+b('open-export','Exporter Excel','primary'))+weekbar()+
    `<div class="stats"><div class="stat"><div class="label">Opérations travaillées</div><strong>${s.active.toString().padStart(2,'0')}</strong><span class="note">${w.operations.length-s.active} non travaillée(s)</span></div><div class="stat"><div class="label">Complétude des champs</div><strong>${s.percent}<span style="font-size:17px"> %</span></strong><div class="progress"><i style="width:${s.percent}%"></i></div></div><div class="stat"><div class="label">Opérations complètes</div><strong>${s.complete}<span style="font-size:16px;color:var(--muted)"> / ${s.active}</span></strong><span class="note">${s.blocking} point(s) à compléter</span></div><div class="stat"><div class="label">Relues pour cette semaine</div><strong>${s.reviewed}<span style="font-size:16px;color:var(--muted)"> / ${s.active}</span></strong><span class="note">${s.warnings} alerte(s) de cohérence</span></div></div>`+
    (!state.introDismissed?`<div class="notice"><div style="display:flex;justify-content:space-between;gap:12px"><span><strong>Une fiche chantier, plusieurs configurations.</strong> Les ZEP, consignations, horaires et moyens sont repris ensemble depuis une configuration identifiée. Une reprise ne vaut ni validation du planning ni autorisation de travaux.</span>${b('dismiss-intro','×','ghost small','aria-label="Masquer cette explication"')}</div></div>`:'')+
    `<section class="panel"><div class="panelhead"><div><h2>Chantiers de la semaine</h2><p>Une ligne par combinaison de zone, jours, horaires et moyens.</p></div><div class="actions">${b('add-projects','+ Ajouter des chantiers','primary small')}</div></div>${w.operations.length?w.operations.map(operationRow).join(''):`<div class="empty"><div class="emptyicon">▦</div><h3>Quels chantiers sont travaillés en S${w.week} ?</h3><p>Sélectionnez vos chantiers dans les ${activeProjects().length} fiches disponibles. Les champs de programmation se préremplissent avec la configuration choisie.</p>${b('add-projects','Choisir les chantiers travaillés','primary')}<div class="steps"><span><b>1</b> Choisir le chantier</span><span><b>2</b> Ajuster et relire</span><span><b>3</b> Exporter la trame Excel</span></div></div>`}</section>`+
    `<div class="section-title"><h2>Accès rapide aux fiches</h2>${b('nav','Toutes les fiches →','ghost small','data-view="projects"')}</div><div class="cards">${['samois','montereau','cepoy'].map(id=>project(id)).filter(Boolean).map(p=>projectCard(p,true)).join('')}</div><footer class="app-note">28 colonnes de la trame · S9 / S11 distincts · Jours et nuits séparés · ${SEED.sourceLineCount} lignes source conservées dans l’historique</footer>`;
  }
  function operationRow(o,index){
    const r=C.evaluate(o),status=!o.active?'Non travaillé':r.complete?(o.reviewed?'Relu':'À relire'):'À compléter';
    const days=o.slots.filter(s=>C.dayCols.includes(s)).length,nights=o.slots.filter(s=>C.nightCols.includes(s)).length;
    return `<article class="operation ${o.active?'':'off'}"><div class="op-title"><label title="Travaillé cette semaine"><input type="checkbox" data-active="${e(o.id)}" aria-label="Chantier travaillé : ${e(o.label)}" ${o.active?'checked':''}></label><div><h3>${e(o.fields.A||String(index+1).padStart(2,'0'))} · ${e(o.label)}</h3><div class="source">${e(C.sourceLabel(o.origin))}</div><div class="tiny muted" style="margin-top:4px">${e((o.fields.S||'Gare à préciser').replace(/\n/g,' / '))}</div></div></div><div class="op-slots"><div class="chips">${days?`<span class="chip">${days} jour(s)</span>`:''}${nights?`<span class="chip night">${nights} nuit(s)</span>`:''}${!o.slots.length?'<span class="chip">Créneaux à choisir</span>':''}</div><div class="tiny muted" style="white-space:pre-line;line-height:1.45;margin-top:6px;font-size:10px">${e((o.fields.U||'Horaires à préciser').slice(0,100))}</div></div><div class="op-progress"><div class="meta"><span>${e(status)}</span><strong>${r.percent}%</strong></div><div class="progress"><i style="width:${r.percent}%"></i></div><div class="tiny muted">${!o.active?'Exclu de l’export':r.complete?(o.reviewed?e(o.reviewedBy):'Relecture requise'):`${r.missing.length+r.errors.length} point(s) restant(s)`}</div></div><div class="actions">${b('edit-operation','Compléter','small',`data-id="${e(o.id)}"`)}${b('duplicate-operation','⧉','small',`data-id="${e(o.id)}" title="Dupliquer l’opération pour une autre zone ou un autre créneau" aria-label="Dupliquer ${e(o.label)}"`)}${b('delete-operation','×','small danger',`data-id="${e(o.id)}" title="Retirer l’opération de cette semaine" aria-label="Retirer ${e(o.label)}"`)}</div></article>`;
  }
  function projectCard(p,quick=false){const v=profileOf(p);return `<article class="project-card" data-project-name="${e(C.normalized(p.name))}"><div><span class="badge">FICHE CHANTIER</span><span class="countpill">${p.profiles.length} config.</span></div><h3>${e(p.name)}</h3><div class="cardmeta">${e(v.label)} · ${e((v.fields.S||'Gare à préciser').replace(/\n/g,' / '))}</div><div class="excerpt">${e(v.fields.V||'ZEP à configurer')}</div><div class="actions">${b('edit-project','Ouvrir la fiche','small',`data-id="${e(p.id)}"`)}${b('quick-add','+ Programmer','primary small',`data-id="${e(p.id)}"`)}</div></article>`;}
  function projectsPage(){return heading('Référentiel chantier','Vos fiches chantiers.','Un réglage réutilisable pour les ZEP, SEL / secteurs, zones travaux, LAM, TTX et besoins gare.',b('new-project','+ Nouveau chantier','primary'))+`<div class="notice">Les configurations du classeur initial restent disponibles. Vos modifications de fiche ne changent pas les semaines déjà préparées. Le choix par défaut est une configuration source entière, pas un assemblage de plusieurs semaines.</div><div class="section-title"><h2>${activeProjects().length} fiches disponibles</h2><input class="search" id="project-search" type="search" placeholder="Rechercher un chantier…" aria-label="Rechercher un chantier"></div><div class="cards" id="project-cards">${activeProjects().map(p=>projectCard(p)).join('')}</div>`;}
  function historyPage(){return heading('Traçabilité','Les semaines et leurs reprises.','Les programmations importées sont des prévisions issues du fichier, pas des travaux réalisés.',b('new-week','+ Nouvelle semaine','primary'))+`<div class="panel"><div class="panelhead"><div><h2>${state.weeks.length} programmations enregistrées</h2><p>Semaines et week-ends restent séparés.</p></div>${b('export-multiple','Exporter plusieurs semaines','small')}</div>${sortedWeeks().map(w=>{const s=C.weekStats(w);return `<div class="history-row"><div><div class="title">${e(C.weekLabel(w))} ${w.kind==='import'?fieldBadge('Prévision importée'):fieldBadge('Préparation','good')}</div><div class="muted">${e(C.rangeLabel(w))} · ${s.active} opération(s) · ${s.percent}% de champs complétés · ${s.reviewed} relue(s)</div>${w.copiedFrom?`<div class="muted">Reprise de ${e(w.copiedFrom.label)} ; relectures réinitialisées.</div>`:''}</div><div class="actions">${b('open-week','Ouvrir','small',`data-id="${e(w.id)}"`)}${b('copy-specific','Reprendre','small',`data-id="${e(w.id)}"`)}${w.kind!=='import'?b('delete-week','Supprimer','small danger',`data-id="${e(w.id)}"`):''}</div></div>`;}).join('')}</div><div class="notice warning">Les ${SEED.hiddenSheetCount} feuilles masquées du fichier initial ne servent pas au préremplissage automatique. Elles contiennent notamment d’anciennes programmations de S45 à S52. Une nouvelle S47 part donc de vos choix, sans reprendre silencieusement l’ancien onglet masqué.</div>`;}
  function checksPage(){const w=current(),active=w.operations.filter(o=>o.active);return heading('Avant transmission','Complétude et relecture.','Corrigez les champs manquants, puis relisez chaque opération pour cette semaine.',b('open-export','Exporter Excel','primary'))+weekbar()+`<div class="notice warning"><strong>Contrôle de saisie, pas contrôle réglementaire.</strong> Les protections, consignations, horaires, points de mise en voie et disponibilités doivent être vérifiés par les personnes compétentes avant transmission.</div><div class="panel"><div class="panelhead"><h2>${active.length} opération(s) à contrôler</h2>${fieldBadge(C.finalProblems(w).length?'Export relu non disponible':'Export relu disponible',C.finalProblems(w).length?'warn':'good')}</div>${active.length?active.map(o=>{const r=C.evaluate(o);return `<div class="checkblock"><div class="heading"><h3>${e(o.label)}</h3>${b('edit-operation','Corriger / relire','small',`data-id="${e(o.id)}"`)}</div><ul class="checklist">${r.missing.map(x=>`<li class="missing"><span class="mark">!</span>${e(x.message)}</li>`).join('')}${r.errors.map(x=>`<li class="missing"><span class="mark">!</span>${e(x)}</li>`).join('')}${r.warnings.map(x=>`<li class="hint"><span class="mark">△</span>${e(x)}</li>`).join('')}${!o.reviewed?'<li><span class="mark">○</span>Relecture nominative non effectuée pour cette semaine.</li>':`<li><span class="mark" style="color:var(--teal)">✓</span>Relu par ${e(o.reviewedBy)} le ${e(new Date(o.reviewedAt).toLocaleString('fr-FR'))}.</li>`}${r.complete?'<li><span class="mark" style="color:var(--teal)">✓</span>Tous les champs contrôlés sont renseignés.</li>':''}</ul></div>`;}).join(''):'<div class="empty"><p>Aucune opération travaillée dans cette semaine.</p></div>'}</div>`;}
  function dataPage(){return heading('Sauvegarde & méthode','Vos données restent sous votre contrôle.','Sauvegardez vos fiches et vos semaines dans un fichier JSON pour les retrouver ou les transférer.')+`<div class="twocol"><div><section class="panel"><div class="panelhead"><h2>Sauvegarde et restauration</h2></div><div class="panelbody help"><p>L’application conserve vos données dans ce navigateur. La sauvegarde JSON emporte toutes les fiches, configurations, semaines et relectures. Elle n’est pas une synchronisation à plusieurs.</p><div class="actions">${b('backup','Sauvegarder JSON','primary')}${b('restore','Restaurer un JSON')}</div><p class="tiny" style="margin-top:15px">Dernière sauvegarde déclenchée : ${state.lastBackup?e(new Date(state.lastBackup).toLocaleString('fr-FR')):'aucune'}. Vérifiez que le fichier a bien été conservé sur votre appareil.</p>${b('restore-previous','Récupérer l’état local précédent','small')}</div></section><section class="panel"><div class="panelhead"><h2>Importer une nouvelle programmation</h2></div><div class="panelbody help"><p>Import XLSX de la même trame : les lignes PETIT, DAHMANI, DHAMANI ou DAMANI sont proposées. Les cellules fusionnées sont lues. Les importations ajoutent des versions ; elles n’écrasent pas vos semaines.</p>${b('import-excel','Importer un classeur XLSX','primary')}<p class="tiny" style="margin-top:13px">Les autres responsables sont exclus. Les feuilles masquées ne sont importées que sur sélection explicite.</p></div></section><section class="panel"><div class="panelhead"><h2>Source initiale</h2></div><div class="panelbody help"><p><strong>${e(SEED.sourceName)}</strong><br>${SEED.sourceLineCount} lignes · 11 chantiers · 30 configurations · 10 feuilles visibles utiles.</p><p>Différences conservées : contacts DAHMANI finissant par 52 ou 53 ; variante DHAMANI ; références « CHA ????? » ; champs laissés vides. Aucune correction métier n’a été inventée.</p>${b('download-source','Récupérer le classeur source','small')}</div></section></div><div><section class="panel"><div class="panelhead"><h2>Mode d’emploi</h2></div><div class="panelbody help"><h3>1. Préparer le référentiel</h3><p>Ouvrez une fiche chantier, choisissez une configuration source et ajustez les champs. Enregistrez-la sous un nom clair : « Renforcement nuit », « Week-end », « Mise en service »…</p><h3>2. Préparer la semaine</h3><p>Créez la semaine, puis ajoutez les chantiers travaillés. Choisissez les jours et nuits. La nuit dimanche → lundi précédant la semaine est distincte de celle du dimanche suivant.</p><h3>3. Compléter et relire</h3><p>Les onglets de la fiche couvrent les colonnes A à AB du classeur. La colonne A peut rester vide : le numéro sera automatique. Pour un champ non applicable, indiquez explicitement « Sans objet » ou « Néant » après vérification.</p><h3>4. Exporter</h3><p>Un brouillon reste possible avant complétude. L’export « Relue » nécessite les champs renseignés et une relecture nominative. L’Excel reprend les 28 colonnes, en-têtes, styles et couleurs. Les lignes chantier ne sont pas fusionnées entre elles afin de ne pas masquer de mesures.</p><p>Impression par défaut A3 paysage, une page en largeur, plusieurs en hauteur, avec répétition de l’en-tête. Une exportation dans le classeur complet ajoute des onglets « préparée » sans remplacer les feuilles initiales.</p><h3>Confidentialité et limites</h3><p>Pas d’envoi automatique de mail, de serveur, de compte utilisateur ou de synchronisation. Cette archive contient des données internes et des téléphones : ne la publiez pas sur un site ou dépôt public. Pour une installation en ligne, utiliser un hébergement interne protégé et autorisé.</p><p>Sur PC : ouvrir <code>index.html</code> avec Chrome ou Edge. Sur un site HTTPS protégé, le manifeste et le service worker fournis permettent le mode installable, sous réserve de prise en charge par le navigateur.</p></div></section></div></div><section class="panel"><div class="panelhead"><h2>Journal des modifications dans l’application</h2></div><div class="panelbody">${(state.audit||[]).slice(0,25).map(a=>`<div class="audit-row">${e(new Date(a.at).toLocaleString('fr-FR'))} · ${e(a.action)} · ${e(a.target||'')}</div>`).join('')||'<span class="muted tiny">Aucune modification enregistrée.</span>'}</div></section>`;}
  function openDialog(title,subtitle,body,foot='',wide=false){
    const d=$('#dialog');d.className=wide?'wide':'';d.innerHTML=`<div class="dialog-head"><div><h2 id="dialog-title">${e(title)}</h2><p>${subtitle}</p></div>${b('close-dialog','×','iconbtn','aria-label="Fermer"')}</div><div class="dialog-body" id="dialog-body">${body}</div><div class="dialog-foot">${foot||`<span></span>${b('close-dialog','Fermer')}`}</div>`;
    if(!d.open)d.showModal();document.body.classList.add('modal-open');
  }
  function closeDialog(force=false){if(editor?.dirty&&!force&&!confirm('Fermer sans enregistrer les modifications de cette fiche ?'))return;$('#dialog').close();document.body.classList.remove('modal-open');editor=null;importCandidate=null;exportCandidate=null;}
  function slotPicker(o,w){
    const days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
    return `<label class="previousnight"><input type="checkbox" data-slot="B" ${o.slots.includes('B')?'checked':''}> Nuit du dimanche précédent au lundi ${e(C.dateLabel(C.dateOffset(w,0)))} <span class="colref">[B]</span></label><div class="calendar">${days.map((name,i)=>{const day=C.dayCols[i],night=C.nightCols[i+1];return `<div class="daybox"><div class="dayhead">${name}<br>${e(C.dateLabel(C.dateOffset(w,i)))}</div><label class="slotcheck"><input type="checkbox" data-slot="${day}" aria-label="${C.slotLabels[day]}" ${o.slots.includes(day)?'checked':''}>Jour</label><label class="slotcheck night"><input type="checkbox" data-slot="${night}" aria-label="${C.slotLabels[night]}" ${o.slots.includes(night)?'checked':''}>Nuit</label></div>`;}).join('')}</div><div class="presets">${b('slots-preset','5 nuits lun. → sam.','small','data-slots="D,F,H,J,L"')}${b('slots-preset','5 jours lun. → ven.','small','data-slots="C,E,G,I,K"')}${b('slots-preset','WE sam. jour + nuit + dim. jour','small','data-slots="M,N,O"')}${b('slots-preset','Tout décocher','small','data-slots=""')}</div>`;
  }
  function fieldInput(k,klass='',help=''){
    const val=editor.draft.fields[k]||'',long=['V','W','X'].includes(k),single=['A','Q'].includes(k);
    const fill=['Q','Y','Z','AB','AA'].includes(k)?b('fill-field',k==='Q'?'Insérer UOTx AINM':(['Y','Z'].includes(k)?'Indiquer Néant':k==='AB'?'Indiquer Aucun besoin':'Indiquer Sans objet'),'ghost small',`data-field="${k}"`):'';
    return `<div class="field ${klass}"><label for="f-${k}"><span>${e(C.fields[k])}${k!=='A'?' <span class="muted">*</span>':''}</span><span class="colref">Excel ${k}</span></label>${single?`<input id="f-${k}" data-field="${k}" maxlength="32767" value="${e(val)}" placeholder="${k==='A'?'Automatique à l’export':'À renseigner'}">`:`<textarea id="f-${k}" data-field="${k}" maxlength="32767" class="${long?'long':'medium'}" placeholder="À renseigner, ou indiquer explicitement Sans objet après vérification">${e(val)}</textarea>`}${help?`<span class="helptext">${help}</span>`:''}${fill?`<div>${fill}</div>`:''}</div>`;
  }
  function measureChoices(k){
    const p=editor.project,values=new Map();
    for(const v of p.profiles)for(const line of (v.fields[k]||'').split('\n').map(x=>x.trim()).filter(Boolean)){if(!values.has(line))values.set(line,[]);values.get(line).push(v.label);}
    for(const line of (editor.draft.fields[k]||'').split('\n').map(x=>x.trim()).filter(Boolean))if(!values.has(line))values.set(line,['Saisie actuelle']);
    const selected=new Set((editor.draft.fields[k]||'').split('\n').map(x=>x.trim()));
    return `<details class="builder"><summary>Choisir dans les ${k==='V'?'ZEP':'SEL / secteurs'} connus de ce chantier (${values.size})</summary><div class="builder-body"><p class="tiny muted">Sélection manuelle uniquement. Les groupements restent indivisibles. Vérifier l’applicabilité de chaque mesure à cette opération.</p><div class="choices">${[...values].map(([line,orig],i)=>`<label class="choice"><input type="checkbox" data-measure="${k}" value="${e(line)}" ${selected.has(line)?'checked':''}><span>${e(line)}<small>${e([...new Set(orig)].slice(0,3).join(' · '))}</small></span></label>`).join('')||'<p class="tiny muted" style="padding:12px">Aucune mesure connue. Saisissez le libellé directement dans le champ.</p>'}</div>${b('apply-measures','Appliquer ma sélection','small primary',`data-field="${k}"`)}</div></details>`;
  }

ldInput('V')}${measureChoices('V')}${fieldInput('W')}${measureChoices('W')}</section><section data-editor-section="moyens" ${tab==='moyens'?'':'hidden'}>${fieldInput('Y','','Préciser chaque TTX et ses points d’engagement et de dégagement. « Néant » doit être un choix explicite.')}${equipmentBuilder('Y')}${fieldInput('Z','','LAM, pelles rail-route, ELAN : nature, nombre, engagement et dégagement.')}${equipmentBuilder('Z')}${fieldInput('AB','','Ouverture de gare et besoin en renfort T ; indiquer Aucun besoin lorsque cela a été vérifié.')}</section><section data-editor-section="validation" ${tab==='validation'?'':'hidden'}>${fieldInput('AA','','N° RP, CCTT / CHA, AS, LTV, programmation gare, PTDM, coactivité et autres observations. Aucune référence n’est inventée.')}<div class="field"><label>Note de préparation <span class="colref">Application seulement · non exportée en Excel</span></label><textarea id="operation-notes" style="min-height:80px">${e(o.notes||'')}</textarea></div>${isProfile?`<div class="notice">La configuration enregistrée devient le choix par défaut du chantier. Les variantes sources et les semaines déjà préparées sont conservées. La relecture reste à faire pour chaque semaine.</div>`:`<div class="reviewbox"><h3>Relecture pour ${e(C.weekLabel(w))}</h3><div id="review-status" class="tiny muted">${r.complete?'Les champs de complétude sont renseignés.':'Des champs restent à compléter avant de pouvoir cocher la relecture.'}</div><label class="tiny" for="reviewer">Relecture effectuée par</label><input id="reviewer" type="text" maxlength="100" value="${e(o.reviewedBy||state.reviewer||'')}" placeholder="Nom et prénom de la personne qui relit"><label class="checklabel"><input id="reviewed-check" type="checkbox" ${o.reviewed?'checked':''}><span>J’ai vérifié le planning de cette semaine, les jours / nuits, les horaires, les ZEP / consignations, la zone chantier, les moyens, leurs points d’engagement / dégagement, les besoins gare, les références et les contacts.</span></label><p class="tiny muted" style="margin:12px 0 0">La relecture est annulée dès qu’une donnée de cette opération est modifiée. Elle ne vaut ni attribution de capacité ni autorisation de travaux.</p></div>`}<div style="margin-top:17px" id="editor-all-issues">${issuesHTML(o)}</div></section></div><aside class="editor-aside"><h3>Complétude de la ligne</h3><div id="editor-percent" style="font-size:35px;font-weight:800;color:var(--teal)">${r.percent}%</div><div class="progress" style="margin-bottom:17px"><i id="editor-progress" style="width:${r.percent}%"></i></div><div id="editor-missing">${r.missing.map(m=>`<div class="field-mini">${e(m.message)}</div>`).join('')}</div><div class="notice" style="margin-top:17px">${isProfile?'Enregistrer une fiche ne modifie pas les anciennes semaines.':'Modifier cette opération ne modifie pas sa fiche chantier. Pour conserver vos réglages, utilisez ensuite « En faire une configuration ».'}</div>${!isProfile?b('save-as-profile','En faire une configuration','small'):''}</aside></div>`;

  function saveEditor(asProfile=false){

      const name=mode==='profile'?editor.projectName.trim():p.name;
      const label=mode==='profile'?editor.profileName.trim():prompt('Nom de cette configuration réutilisable :','Configuration '+C.weekLabel(current()));

      const v={id:C.uid('cfg'),label:label.trim(),fields:{...C.clone(o.fields),A:''},slots:C.clone(o.slots),sources:o.origin?[C.clone(o.origin)]:[],updatedAt:C.now(),custom:true};p.profiles.unshift(v);p.defaultProfileId=v.id;
      persist('Configuration enregistrée',p.name+' / '+v.label);if(asProfile){toast('Configuration ajoutée à la fiche. L’opération reste ouverte, pensez à l’enregistrer.');return;}

  }

  function weekDialog(copyId=null,edit=false){

  function createWeek(edit=false){
    const year=Number($('#new-year').value),week=Number($('#new-week').value),period=$('#new-period').value;if(!C.validWeek(year,week))throw new Error('Semaine ISO invalide : '+year+' comporte '+C.maxWeeks(year)+' semaines.');

      const source=state.weeks.find(w=>w.id===$('#new-copy').value),w=C.makeWeek(year,week,period);
      if(source){w.operations=C.clone(source.operations).map(o=>{o.id=C.uid('op');o.fields.A='';C.resetReview(o);return o;});w.copiedFrom={id:source.id,label:C.weekLabel(source),at:C.now()};}

  async function generateExport(button){

  }

  function backup(){state.lastBackup=C.now();persist();const data={app:'ainm-programmation',schemaVersion:1,version:'1.0.0',exportedAt:C.now(),state};download(JSON.stringify(data,null,2),'Sauvegarde_AINM_'+C.now().slice(0,10)+'.json','application/json');toast('Sauvegarde JSON générée. Conservez-la dans votre dossier professionnel.');if(view==='data')render();}
  function restoreDialog(){openDialog('Restaurer une sauvegarde','La restauration remplacera les fiches et semaines présentes dans ce navigateur.',`<div class="notice warning">Sauvegardez d’abord l’état actuel. N’importez qu’une sauvegarde AINM de confiance.</div><label class="filelabel">Choisir le fichier JSON de sauvegarde<input id="restore-file" type="file" accept=".json,application/json"></label>`,`<span></span><div class="actions">${b('close-dialog','Annuler')}${b('confirm-restore','Restaurer','primary')}</div>`);}
  async function confirmRestore(){const file=$('#restore-file').files[0];if(!file)throw new Error('Choisir un fichier JSON.');if(file.size>20*1024*1024)throw new Error('Sauvegarde trop volumineuse (20 Mo maximum).');const replacement=C.validateBackup(JSON.parse(await file.text()));if(!confirm('Remplacer les données locales actuelles par cette sauvegarde ?'))return;state=C.clone(replacement);foreignChange=false;persist('Sauvegarde restaurée',file.name);closeDialog(true);render();toast('Sauvegarde restaurée.');}
  function importDialog(){importCandidate=null;openDialog('Importer une programmation XLSX','Même trame AINM · seules vos lignes sont extraites.',`<label class="filelabel">Choisir un fichier Excel de programmation<input id="import-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><div id="import-preview"><p class="tiny muted">Le classeur est lu sur cet appareil. Aucune donnée n’est envoyée à un serveur.</p></div>`,`<span class="muted">Ajout de versions, sans remplacement des semaines.</span><div class="actions">${b('close-dialog','Annuler')}${b('confirm-import','Importer la sélection','primary','disabled')}</div>`);}
  async function readImport(file){if(!file)return;$('#import-preview').innerHTML='<p class="muted">Lecture et contrôle du classeur…</p>';importCandidate=await Excel.readWorkbook(await file.arrayBuffer(),file.name);const usable=importCandidate.sheets.filter(s=>s.isTemplate&&s.records.length&&C.validWeek(s.year,s.week));if(!usable.length)throw new Error('Aucune ligne PETIT / DAHMANI reconnue dans une feuille au format AINM.');$('#import-preview').innerHTML=`<div class="notice">${usable.reduce((n,s)=>n+s.records.length,0)} ligne(s) trouvée(s). Les noms de chantiers reconnus sont rattachés aux fiches existantes ; les intitulés nouveaux créent des fiches distinctes.</div><div class="export-list">${usable.map(s=>`<label class="checklabel"><input type="checkbox" data-import-sheet="${e(s.path)}" ${s.hidden?'':'checked'}><span><strong>${e(s.name)}</strong> · ${s.records.length} ligne(s) ${s.hidden?fieldBadge('Feuille masquée','warn'):''}<br><span class="tiny muted">${s.year} · S${s.week}</span></span></label>`).join('')}</div>`;$('[data-action=confirm-import]').disabled=false;}
  function confirmImport(){
    if(!importCandidate)throw new Error('Choisir un classeur.');const paths=$$('[data-import-sheet]:checked').map(ch=>ch.dataset.importSheet);if(!paths.length)throw new Error('Sélectionner une feuille.');let count=0;
    for(const sh of importCandidate.sheets.filter(s=>paths.includes(s.path))){const w=C.makeWeek(sh.year,sh.week,sh.period);w.kind='import';w.sourceName=importCandidate.sourceName;w.name=sh.name;
      for(const row of sh.records){const [pid,name]=C.identify(row.fields.X);let p=project(pid);if(!p){p={id:pid,name,notes:'Chantier créé à partir d’un import : vérifier son intitulé et son rattachement.',profiles:[],defaultProfileId:null,archived:false};state.projects.push(p);}
        const origin={file:importCandidate.sourceName,sheet:sh.name,row:row.row,year:sh.year,week:sh.week,period:sh.period,inherited:row.inherited},fields={...C.blankFields(),...row.fields,A:''};
        let v=p.profiles.find(v=>JSON.stringify(v.fields)===JSON.stringify(fields)&&JSON.stringify(v.slots)===JSON.stringify(row.slots));
        if(!v){v={id:C.uid('cfg'),label:`Import ${sh.name} · ligne ${row.row}`,fields,slots:row.slots,sources:[origin],updatedAt:C.now()};p.profiles.push(v);if(!p.defaultProfileId)p.defaultProfileId=v.id;}
        else v.sources.push(origin);
        const o=C.fromProfile(p,v);o.fields.A=row.fields.A;o.origin=origin;w.operations.push(o);count++;
      }
      state.weeks.push(w);state.selectedWeek=w.id;
    }
    persist('Classeur importé',importCandidate.sourceName);closeDialog(true);view='history';render();toast(count+' ligne(s) importée(s). Les configurations par défaut existantes sont conservées.');
  }
  function newProjectDialog(){openDialog('Créer une fiche chantier','Un nouveau chantier commence sans mesure, horaire ou engin inventé.',`<div class="field"><label for="new-project-name">Nom du chantier</label><input id="new-project-name" maxlength="140" placeholder="Ex. Sous-station…"></div><div class="notice">La nouvelle fiche sera ensuite entièrement modifiable. Renseignez un demandeur du périmètre Petit / Dahmani.</div>`,`<span></span><div class="actions">${b('close-dialog','Annuler')}${b('confirm-new-project','Créer la fiche','primary')}</div>`);}
  function createProject(){const name=$('#new-project-name').value.trim();if(!name)throw new Error('Renseigner le nom du chantier.');const v={id:C.uid('cfg'),label:'Configuration à compléter',fields:C.blankFields(),slots:[],sources:[],custom:true,updatedAt:C.now()},p={id:C.uid('chantier'),name,notes:'',profiles:[v],defaultProfileId:v.id,archived:false};state.projects.push(p);persist('Fiche chantier créée',name);closeDialog(true);view='projects';render();editProject(p.id);}
  function timeToField(replace=false){const a=$('#time-start').value,z=$('#time-end').value,l=$('#time-label').value.trim(),da=$('#date-start').value,dz=$('#date-end').value;if(!a||!z)throw new Error('Renseigner une heure de début et une heure de fin.');if(da&&dz&&dz<da)throw new Error('La date de fin précède la date de début.');const frDate=s=>s?s.split('-').reverse().join('/')+' ':'';const text=(l?l+' : ':'')+frDate(da)+a.replace(':','h')+' - '+frDate(dz)+z.replace(':','h');if(replace&&editor.draft.fields.U&&!confirm('Remplacer toutes les plages horaires actuellement saisies ?'))return;setDraftField('U',replace?text:[editor.draft.fields.U,text].filter(Boolean).join('\n'));toast('Plage ajoutée aux horaires demandés.');}
  function setDraftField(k,v){editor.draft.fields[k]=v;const input=$('#f-'+k);if(input)input.value=v;editorDirty();}
  function addEquipment(k){const nature=$('#eq-'+k+'-nature').value.trim(),qty=Number($('#eq-'+k+'-qty').value),eng=$('#eq-'+k+'-eng').value.trim(),deg=$('#eq-'+k+'-deg').value.trim(),note=$('#eq-'+k+'-note').value.trim();if(!nature||!Number.isInteger(qty)||qty<1||qty>99)throw new Error('Renseigner la nature et un nombre entier d’engins (1 à 99).');if(!eng||!deg)throw new Error('Préciser les points d’engagement et de dégagement.');const text=`${nature} × ${qty}\nEngagement / MEV : ${eng}\nDégagement / MHV : ${deg}${note?'\n'+note:''}`;setDraftField(k,[C.noMeans(editor.draft.fields[k])?'':editor.draft.fields[k],text].filter(Boolean).join('\n\n'));toast((k==='Y'?'TTX':'LAM')+' ajouté.');}
  async function action(button){const a=button.dataset.action,id=button.dataset.id;
    switch(a){
      case 'nav':view=button.dataset.view;render();window.scrollTo(0,0);break;
      case 'dismiss-intro':state.introDismissed=true;persist();render();break;
      case 'backup':backup();break;
      case 'new-week':weekDialog();break;
      case 'edit-week':weekDialog(null,true);break;
      case 'copy-week':weekDialog(current().id);break;
      case 'copy-specific':weekDialog(id);break;
      case 'confirm-new-week':createWeek();break;
      case 'confirm-edit-week':createWeek(true);break;
      case 'open-week':state.selectedWeek=id;view='planning';persist();render();break;
      case 'delete-week':if(confirm('Supprimer cette programmation de l’application ? Les fiches chantier restent conservées.')){state.weeks=state.weeks.filter(w=>w.id!==id);if(state.selectedWeek===id)state.selectedWeek=state.weeks[0]?.id;if(!state.weeks.length){const w=C.makeWeek(2026,47);state.weeks.push(w);state.selectedWeek=w.id;}persist('Semaine supprimée',id);render();}break;
      case 'add-projects':addDialog();break;
      case 'confirm-add':addSelected();break;
      case 'quick-add':{const p=project(id);addDialog();const ch=$(`[data-add-project="${p.id}"]`);ch.checked=true;ch.closest('.addrow').scrollIntoView({block:'center'});break;}
      case 'edit-operation':editOperation(id);break;
      case 'duplicate-operation':{const src=current().operations.find(o=>o.id===id),o=C.clone(src);o.id=C.uid('op');o.fields.A='';C.resetReview(o);current().operations.splice(current().operations.indexOf(src)+1,0,o);markWeek();persist('Opération dupliquée',o.label);render();editOperation(o.id);break;}
      case 'delete-operation':{const o=current().operations.find(o=>o.id===id);if(confirm('Retirer « '+o.label+' » de cette semaine ? La fiche chantier sera conservée.')){current().operations=current().operations.filter(o=>o.id!==id);markWeek();persist('Opération retirée',o.label);render();}break;}
      case 'edit-project':editProject(id);break;
      case 'new-project':newProjectDialog();break;
      case 'confirm-new-project':createProject();break;
      case 'close-dialog':closeDialog();break;
      case 'editor-tab':editor.tab=button.dataset.tab;$$('[data-editor-section]').forEach(el=>el.hidden=el.dataset.editorSection!==editor.tab);$$('[data-action=editor-tab]').forEach(el=>{el.classList.toggle('selected',el.dataset.tab===editor.tab);el.setAttribute('aria-selected',el.dataset.tab===editor.tab);});$('#dialog-body').scrollTo({top:0});break;
      case 'slots-preset':editor.draft.slots=button.dataset.slots?button.dataset.slots.split(','):[];$$('[data-slot]').forEach(el=>el.checked=editor.draft.slots.includes(el.dataset.slot));editorDirty();break;
      case 'fill-field':{const k=button.dataset.field;setDraftField(k,k==='Q'?'UOTx AINM':['Y','Z'].includes(k)?'Néant':k==='AB'?'Aucun besoin':'Sans objet');break;}
      case 'apply-measures':{const k=button.dataset.field;setDraftField(k,$$(`[data-measure="${k}"]:checked`).map(el=>el.value).join('\n'));toast('Sélection appliquée dans le champ '+k+'.');break;}
      case 'add-time':timeToField();break;
      case 'replace-time':timeToField(true);break;
      case 'add-equipment':addEquipment(button.dataset.field);break;
      case 'save-editor':saveEditor();break;
      case 'save-as-profile':saveEditor(true);break;
      case 'preview':preview();break;
      case 'open-export':exportDialog();break;
      case 'export-multiple':exportDialog(true);break;
      case 'generate-export':await generateExport(button);break;
      case 'restore':restoreDialog();break;
      case 'confirm-restore':await confirmRestore();break;
      case 'restore-previous':{const text=localStorage.getItem(KEY+'.previous');if(!text)throw new Error('Aucun état précédent disponible.');const previous=C.validateBackup({app:'ainm-programmation',schemaVersion:1,state:JSON.parse(text)});if(confirm('Remplacer l’état courant par l’état local précédent ?')){state=previous;foreignChange=false;persist('État précédent restauré');render();toast('État précédent restauré.');}break;}
      case 'import-excel':importDialog();break;
      case 'confirm-import':confirmImport();break;
      case 'download-source':download(Uint8Array.from(atob(TEMPLATE_B64),c=>c.charCodeAt(0)),SEED.sourceName,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');break;
    }
  }
  function inputEvent(ev){const t=ev.target;
    if(t.id==='project-search'){$$('[data-project-name]').forEach(c=>c.hidden=!c.dataset.projectName.includes(C.normalized(t.value)));return;}
    if(t.id==='add-search'){$$('[data-search]').forEach(c=>c.hidden=!c.dataset.search.includes(C.normalized(t.value)));return;}
    if(!editor)return;
    if(t.matches('input[data-field],textarea[data-field]')){editor.draft.fields[t.dataset.field]=t.value;editorDirty();}
    if(t.id==='project-name'){editor.projectName=t.value;editor.dirty=true;}
    if(t.id==='profile-name'){editor.profileName=t.value;editor.dirty=true;}
    if(t.id==='project-notes'){editor.projectNotes=t.value;editor.dirty=true;}
    if(t.id==='operation-notes'){editor.draft.notes=t.value;editor.dirty=true;}
    if(t.id==='reviewer'){editor.draft.reviewedBy=t.value;editor.dirty=true;}
  }
  async function changeEvent(ev){const t=ev.target;
    if(t.id==='week-select'){state.selectedWeek=t.value;persist();render();return;}
    if(t.dataset.active){const o=current().operations.find(o=>o.id===t.dataset.active);o.active=t.checked;C.resetReview(o);markWeek();persist('Statut travaillé modifié',o.label);render();return;}
    if(t.id==='import-file'){await readImport(t.files[0]);return;}
    if(!editor)return;
    if(t.dataset.slot){editor.draft.slots=$$('[data-slot]:checked').map(el=>el.dataset.slot).sort((a,b)=>C.cols.indexOf(a)-C.cols.indexOf(b));editorDirty();}
    if(t.id==='editor-profile'&&t.value){const v=editor.project.profiles.find(v=>v.id===t.value);if(!confirm('Reprendre tous les champs ET les jours/nuits de « '+v.label+' » ? La saisie en cours et la relecture seront remplacées.')){t.value=editor.selectedProfile||'';return;}editor.draft.fields=C.clone(v.fields);editor.draft.slots=C.clone(v.slots);editor.draft.profileId=v.id;editor.draft.origin=C.clone(v.sources?.at(-1)||null);editor.selectedProfile=v.id;editorDirty();renderEditor();}
    if(t.id==='reviewed-check'){if(t.checked&&!C.evaluate({...editor.draft,active:true}).complete){t.checked=false;throw new Error('La relecture ne peut être cochée qu’une fois les champs complétés et les données en attente corrigées.');}editor.draft.reviewed=t.checked;editor.dirty=true;}
  }
  function init(){load();shell();render();
    document.addEventListener('click',ev=>{const button=ev.target.closest('[data-action]');if(!button)return;ev.preventDefault();Promise.resolve(action(button)).catch(err=>{console.error(err);toast(err.message||String(err),true);});});
    document.addEventListener('input',inputEvent);
    document.addEventListener('change',ev=>Promise.resolve(changeEvent(ev)).catch(err=>{console.error(err);toast(err.message||String(err),true);}));
    $('#dialog').addEventListener('cancel',ev=>{ev.preventDefault();closeDialog();});
    window.addEventListener('beforeunload',ev=>{if(editor?.dirty||!storageOK){ev.preventDefault();ev.returnValue='';}});
    window.addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue){try{if(JSON.parse(ev.newValue).revision!==state.revision){foreignChange=true;warnStorage('Un autre onglet a modifié les données. Sauvegardez vos changements en JSON puis rechargez cette page pour éviter un écrasement.');}}catch{}}});
    if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
      if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  }
  return {init,getState:()=>state,setState:s=>{state=s;render();},render,editOperation,editProject,current,download,persist};
})();
try{App.init();window.AINM={C,ZIP,Excel,App,SEED};}catch(err){document.getElementById('app').innerHTML='<div id="fatal"><h1>Impossible de démarrer l’application</h1><p>'+C.escape(err.message)+'</p><p>Ouvrez le fichier index.html dans une version récente de Chrome ou Edge. Vos fichiers Excel et JSON ne sont pas modifiés.</p></div>';console.error(err);}
</script></body></html>
